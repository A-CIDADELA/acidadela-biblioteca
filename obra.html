<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A CIDADELA · Obra</title>
<meta name="description" content="Edições conferidas desta obra, com a indicação de tradução e de notas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
  :root{
    --paper:#E9EBEE; --ink:#1C1C1E; --muted:#585D66; --rule:#C3C8CF;
    --panel:#D5D9DE; --accent:#3D424A; --band:#222224; --silver:#8E949D;
    --serif:"Instrument Serif", "Iowan Old Style", Georgia, serif;
    --sans:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme:light;
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--paper); color:var(--ink);
    font:400 16px/1.6 var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  .faixa{background:var(--band);padding-block:clamp(24px,5vw,48px);padding-inline:max(16px, env(safe-area-inset-left,0px)) max(16px, env(safe-area-inset-right,0px));}
  .faixa .marca{max-width:1000px;margin:0 auto}
  .marca img{display:block;width:100%;height:auto}
  .faixa .marca img{-webkit-mask-image:none;mask-image:none}
  :focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:2px}
  main{max-width:1000px;margin:0 auto;padding-block:28px 72px}
  main{padding-inline:max(16px, env(safe-area-inset-left,0px)) max(16px, env(safe-area-inset-right,0px));}

  .voltar{font-size:15px;margin:0}
  .voltar a{color:var(--muted);text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:4px}
  .voltar a:hover{color:var(--ink)}

  .topo{display:flow-root;margin-top:clamp(28px,5vw,56px)}
  .topo .capa{float:left;width:300px;margin:0 24px 0 0}
  .topo .sobre .texto{margin:0 0 1.65em}
  .topo .texto{max-width:none}
  .capa{position:relative;aspect-ratio:2/3;border-radius:2px;overflow:hidden;max-width:100%}
  .capa.quadro,.ed-capa.quadro{background:#fff}
  .capa.quadro img,.ed-capa.quadro img{padding:7%;box-sizing:border-box}
  .capa img{display:block;width:100%;height:100%;object-fit:contain;object-position:50% 50%}
  .capa.prov{
    display:flex;flex-direction:column;justify-content:space-between;padding:22px;color:#E6E7EA;background:var(--band);border-top:2px solid var(--silver);
  }
  .capa.prov .e{font-size:13px;opacity:.8}
  .capa.prov .t{font-family:var(--serif);font-size:34px;line-height:1.02;text-wrap:balance}
  .capa.prov .a{font-size:14px;opacity:.88;margin-top:8px}

  h1{font-family:var(--serif);font-weight:400;font-size:clamp(40px,6vw,60px);line-height:1;letter-spacing:-.01em;margin:0 0 14px;text-wrap:balance}
  .au{font-size:18px;margin:0 0 6px}
  .meta{font-size:15px;color:var(--muted);margin:0}

  h2{font-family:var(--serif);font-weight:400;font-size:28px;line-height:1.1;margin:0 0 4px}
  .secao{margin-top:clamp(40px,6vw,64px)}

  /* Edições: linhas com régua, sem caixas */
  .edicoes{border-top:1px solid var(--rule);margin:0;padding:0;list-style:none}
  .edicoes li{display:grid;gap:6px 24px;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;align-items:baseline;padding-block:18px;border-bottom:1px solid var(--rule)}
  .edicoes .formato{font-size:15px;font-weight:600}
  .edicoes .ed{margin:0;font-size:16px;line-height:1.5}
  .edicoes .sym{font-family:var(--serif);font-size:19px;color:var(--accent);margin-right:6px}
  .compra{display:inline-block;padding:6px 11px;background:var(--ink);color:#F4F5F7;border-radius:2px;font-size:13px;font-weight:600;letter-spacing:.01em;white-space:nowrap;transition:background .15s}
  .compra:hover{background:var(--accent)}
  .vazio{font-size:16px;color:var(--muted);margin:0;padding-block:18px;border-bottom:1px solid var(--rule)}
  .nao-temos{color:var(--muted);font-style:italic}
  .sem-edicao{margin:0;padding-block:18px;border-bottom:1px solid var(--rule);font-size:16px}

  .como{display:grid;gap:12px;margin:0;padding:0;list-style:none;font-size:15px;color:var(--muted)}
  .como li{display:block}
  .etiq{display:inline-block;font-size:12px;font-weight:600;line-height:1.3;padding:3px 9px;border:1px solid var(--accent);color:var(--accent);border-radius:2px;margin:0 6px 6px 0;background:transparent}
  .etiq.m-orig{background:var(--accent);color:#F4F5F7}
  .etiq.m-outra{border-style:dashed}
  .etiq.m-notas{border-color:var(--silver);color:var(--muted)}
  .como strong{color:var(--ink);font-weight:600}

  .leitura{font-size:16px;margin:0}
  .texto{font-size:17px;line-height:1.65;margin:0 0 12px;max-width:60ch}
  .sobre{margin-top:20px}
  .sobre .texto{font-size:16px;color:var(--muted)}
  h2.sub{font-size:22px;margin-top:28px}
  .ed-linha{margin:14px 0 0;font-size:16px}
  .ed-bloco{margin-top:12px}
  .ed-bloco.com-capa{display:grid;grid-template-columns:minmax(0,120px) minmax(0,1fr);gap:24px;align-items:start}
  .ed-capa{position:relative;border-radius:2px;overflow:hidden;aspect-ratio:2/3;max-width:120px}
  .ed-capa img{display:block;width:100%;height:100%;object-fit:contain;object-position:50% 50%}
  .ed-corpo{min-width:0}

  footer{border-top:1px solid var(--rule);margin-top:72px;padding-top:20px;color:var(--muted);font-size:14px;display:grid;gap:6px}
  footer p{margin:0}

  @media (max-width:720px){
    .topo .capa{float:none;width:100%;max-width:240px;margin:0 0 24px}
    .topo .sobre{margin-top:20px}
    .capa{max-width:240px}
    .edicoes li{grid-template-columns:1fr;gap:4px}
    .ed-bloco.com-capa{grid-template-columns:1fr}
    .ed-capa{max-width:140px}
    .compra{justify-self:start;margin-top:4px}
  }
</style>
</head>
<body>
<div class="faixa"><div class="marca" style="max-width:560px"><a href="index.html"><img src="assets/cabecalho.webp" width="1600" height="640" alt="A CIDADELA, voltar à biblioteca"></a></div></div>
<main>
<p class="voltar"><a href="index.html">Voltar à biblioteca</a></p>
<div id="conteudo"></div>
<footer>
  <p>A CIDADELA · Filosofia e estratégia para a vida</p>
  <p>Contato para direitos autorais: <a href="mailto:arquivo.cidadela@gmail.com">arquivo.cidadela@gmail.com</a></p>
</footer>
</main>

<script src="dados.js"></script>
<script>
function renderObra(){
  const id = new URLSearchParams(location.search).get("id");
  const o = OBRAS.find(x=>x.slug===id);
  const root = document.getElementById("conteudo");

  if(!o){
    root.innerHTML = `<div class="topo"><div><h1>Obra não encontrada</h1><p class="meta">Não há obra neste endereço. Volte à biblioteca e escolha outra.</p></div></div>`;
    return;
  }
  document.title = `${o.t} · A CIDADELA`;

  const era = ERAS.find(x=>x.id===o.e);
  const situ = o.s==="PD" ? "Domínio público" : `Protegida · domínio a partir de ${o.d}`;
  const capaImg = o.img || (o.edicoes[0] && o.edicoes[0].img) || "";
  const capa = capaImg
    ? `<div class="capa${classeCapa(capaImg)}"><img src="${esc(capaImg)}" alt="Capa de ${esc(o.t)}"></div>`
    : `<div class="capa prov" style="--c:${era.cor}"><span class="e">${esc(era.nome)}</span><div><div class="t">${esc(o.t)}</div><div class="a">${esc(o.a)}</div></div></div>`;

  const paragrafos = t => t.split("\n\n").map(p=>`<p class="texto">${esc(p)}</p>`).join("");
  const partesObra = o.sobre ? o.sobre.obra.split("\n\n") : [];
  const ao_lado = partesObra.join("\n\n");
  const abaixo = "";
  const sobreObraHTML = ao_lado ? `<div class="sobre">${paragrafos(ao_lado)}</div>` : "";
  const sobreLargaHTML = abaixo ? `<div class="sobre-larga">${paragrafos(abaixo)}</div>` : "";
  const blocoEdicao = ed => {
    const formatos = FORMATOS.filter(f=>ed.links && ed.links[f.k]);
    const titulo = ed.nome ? `<h2 class="sub">${esc(ed.nome)}</h2>` : "";
    const sobreEd = ed.sobre ? `<p class="texto">${esc(ed.sobre)}</p>` : "";
    const linhas = formatos.map(f=>`
      <li>
        <span class="formato">${esc(f.rotulo)}</span>
        <p class="ed">${marcasHTML(ed.sym)}${esc(ed.ed)}</p>
        <a class="compra" href="${esc(ed.links[f.k])}" target="_blank" rel="noopener sponsored">Ver na Amazon</a>
      </li>`).join("");
    const semFormato = `<p class="ed-linha">${marcasHTML(ed.sym)}${esc(ed.ed)}</p>`;
    const capaEd = ed.img ? `<div class="ed-capa${classeCapa(ed.img)}"><img src="${esc(ed.img)}" alt="Capa da edição ${esc(ed.nome||"")} de ${esc(o.t)}" loading="lazy"></div>` : "";
    return `${titulo}<div class="ed-bloco${ed.img?" com-capa":""}">${capaEd}<div class="ed-corpo">${linhas?"":semFormato}${sobreEd}${linhas?`<ul class="edicoes">${linhas}</ul>`:""}</div></div>`;
  };
  /* Mínimo por obra: capa simples, capa dura e Kindle. O que não temos confirmado é dito como tal. */
  const REQUERIDOS = ["simples","dura","kindle"];
  const presentes = new Set(o.edicoes.flatMap(e=>Object.keys(e.links||{})));
  const faltam = REQUERIDOS.filter(k=>!presentes.has(k));
  const rotulo = k => FORMATOS.find(f=>f.k===k).rotulo;
  const edicoes = o.edicoes.length ? o.edicoes.map(blocoEdicao).join("") : "";

  const leitura = o.leitura
    ? `<div class="secao"><h2>Leitura gratuita</h2><p class="leitura">${esc(o.leitura)}.</p></div>`
    : "";

  root.innerHTML = `
    <div class="topo">
      ${capa}
      <div>
        <h1>${esc(o.t)}</h1>
        <p class="au">${esc(o.a)}</p>
        <p class="meta">${esc(o.esc)} · ${esc(situ)}</p>
        ${sobreObraHTML}
      </div>
    </div>
    ${sobreLargaHTML}
    <section class="secao">
      <h2>Edições</h2>
      ${edicoes}
    </section>
    ${leitura}
    <section class="secao">
      <h2>Como ler a indicação</h2>
      <ul class="como">
        <li><span class="etiq m-orig">Traduzida do original</span>Traduzida diretamente da língua original, com tradutor identificado.</li>
        <li><span class="etiq m-outra">Traduzida de outra língua</span>Traduzida de uma língua intermediária. A língua aparece na indicação da edição.</li>
        <li><span class="etiq m-notas">Com notas ou introdução</span>Introdução, notas, comentário ou cronologia no próprio livro.</li>
      </ul>
    </section>`;
}
renderObra();

/* Alinha a grade de linhas do texto à borda inferior da capa, para que a primeira
   linha de largura total fique sempre à distância lateral da capa (24px).
   Todo espaçamento vertical do texto é múltiplo da altura da linha, então a grade
   não se desloca com o tamanho do texto; só depende do topo, que é medido aqui. */
function alinharCapa(){
  const capa = document.querySelector(".topo .capa");
  const sobre = document.querySelector(".topo .sobre");
  if(!capa || !sobre) return;
  if(!window.matchMedia("(min-width:721px)").matches){ sobre.style.marginTop = ""; return; }
  sobre.style.marginTop = "0px";
  const primeiro = sobre.querySelector(".texto");
  if(!primeiro) return;
  const L = parseFloat(getComputedStyle(primeiro).lineHeight);
  const G = parseFloat(getComputedStyle(capa).marginRight);
  const cb = capa.getBoundingClientRect().bottom;
  const tt = primeiro.getBoundingClientRect().top;
  const rg = document.createRange(); rg.selectNodeContents(primeiro);
  const off = rg.getClientRects()[0].top - tt; /* topo do texto da linha em relação à caixa de linha */
  let d = (cb + G - off - tt) % L;
  if(d < 0) d += L;
  sobre.style.marginTop = d.toFixed(2) + "px";
}
let _alinhaT;
window.addEventListener("resize", ()=>{ clearTimeout(_alinhaT); _alinhaT = setTimeout(alinharCapa, 120); });
if(document.fonts && document.fonts.ready){ document.fonts.ready.then(alinharCapa); }
alinharCapa();
</script>
</body>
</html>
