<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A CIDADELA · Obra</title>
<meta name="description" content="Edições conferidas desta obra, com a indicação de tradução e de notas.">
<style>
  :root{
    --bg:#f7f4ee; --fg:#1d1b18; --muted:#6b645a; --card:#ffffff; --line:#e4ded2;
    --accent:#7a4a1d; --accent-2:#2f4a3a; --soft:#efe9dd;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#17150f; --fg:#f0ebe0; --muted:#a8a091; --card:#221f18; --line:#3a352a;
      --accent:#e0a96a; --accent-2:#9cc2a8; --soft:#2a261d;
    }
  }
  :root[data-theme="dark"]{
    --bg:#17150f; --fg:#f0ebe0; --muted:#a8a091; --card:#221f18; --line:#3a352a;
    --accent:#e0a96a; --accent-2:#9cc2a8; --soft:#2a261d;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--fg);
    font:16px/1.6 Georgia,"Times New Roman",serif;
    padding-inline:max(16px, env(safe-area-inset-left,0px)) max(16px, env(safe-area-inset-right,0px));
  }
  main{max-width:900px;margin:0 auto;padding-block:24px 64px}
  .voltar{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px}
  .voltar a{color:var(--accent-2);font-weight:700}
  .topo{display:grid;gap:24px;grid-template-columns:minmax(0,220px) minmax(0,1fr);align-items:start;margin-top:20px}
  .capa{aspect-ratio:2/3;background:var(--soft);border:1px solid var(--line);border-radius:12px;overflow:hidden;max-width:100%}
  .capa img{display:block;width:100%;height:100%;object-fit:contain}
  .capa.provisoria{
    display:flex;flex-direction:column;justify-content:space-between;padding:16px;color:#fff;background:var(--c,#555);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  .capa.provisoria .t{font-weight:700;font-size:18px;line-height:1.2}
  .capa.provisoria .a{font-size:13px;opacity:.9}
  h1{font-size:clamp(26px,5vw,36px);margin:0 0 6px;line-height:1.15;text-wrap:balance}
  .au{color:var(--muted);margin:0 0 4px}
  .meta{font-size:14px;color:var(--muted);margin:0 0 12px}
  h2{font-size:clamp(19px,3vw,22px);margin:36px 0 8px;text-wrap:balance}
  .panel{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin:16px 0}
  .panel p{margin:6px 0}
  .edicao{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:12px 0;display:grid;gap:6px}
  .edicao .rot{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0}
  .edicao .ed{margin:0}
  .edicao .sym{color:var(--accent);font-weight:700}
  .edicao a.compra{
    display:inline-block;justify-self:start;margin-top:4px;padding:8px 14px;border-radius:8px;
    border:1px solid var(--accent);color:var(--accent);text-decoration:none;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;font-weight:700;
  }
  .vazio{color:var(--muted);font-style:italic}
  .sym{color:var(--accent);font-weight:700}
  footer{border-top:1px solid var(--line);margin-top:48px;padding-top:16px;color:var(--muted);font-size:14px}
  @media (max-width:640px){ .topo{grid-template-columns:1fr} .capa{max-width:260px} }
</style>
</head>
<body>
<main>
<p class="voltar"><a href="index.html">← Voltar à biblioteca</a></p>
<div id="conteudo"></div>
<footer>
  <p>A CIDADELA · Filosofia e estratégia para a vida</p>
  <p>Contato para direitos autorais: <a href="mailto:arquivo.cidadela@gmail.com">arquivo.cidadela@gmail.com</a></p>
</footer>
</main>

<script src="dados.js"></script>
<script>
function renderObra(){
  const id = new URLSearchParams(location.search).get("id");
  const o = OBRAS.find(x=>x.slug===id);
  const root = document.getElementById("conteudo");

  if(!o){
    root.innerHTML = `<h1>Obra não encontrada</h1><p>Não há obra com este endereço. Volte à biblioteca e escolha outra.</p>`;
    return;
  }
  document.title = `${o.t} · A CIDADELA`;

  const era = ERAS.find(x=>x.id===o.e);
  const situ = o.s==="PD" ? "Domínio público" : `Protegida · domínio a partir de ${o.d}`;
  const capa = o.img
    ? `<div class="capa"><img src="${esc(o.img)}" alt="Capa de ${esc(o.t)}"></div>`
    : `<div class="capa provisoria" style="--c:${era.cor}"><span>${esc(era.nome)}</span><div><div class="t">${esc(o.t)}</div><div class="a">${esc(o.a)}</div></div></div>`;

  // Uma seção por formato disponível; cada uma com a edição indicada e o link
  const formatos = FORMATOS.filter(f=>o.links && o.links[f.k]);
  let edicoes;
  if(!o.ed){
    edicoes = `<p class="vazio">Edição em conferência. Nenhum link de compra é mostrado até a edição ser conferida.</p>`;
  } else if(!formatos.length){
    edicoes = `<div class="edicao"><p class="ed"><span class="sym">${esc(o.sym||"")}</span> ${esc(o.ed)}</p></div>`;
  } else {
    edicoes = formatos.map(f=>`
      <div class="edicao">
        <p class="rot">${esc(f.rotulo)}</p>
        <p class="ed">${o.sym?`<span class="sym">${esc(o.sym)}</span> `:""}${esc(o.ed)}</p>
        <a class="compra" href="${esc(o.links[f.k])}" target="_blank" rel="noopener sponsored">Ver na Amazon</a>
      </div>`).join("");
  }

  const leitura = o.leitura
    ? `<div class="panel"><p><strong>Leitura gratuita:</strong> ${esc(o.leitura)}.</p></div>`
    : "";

  root.innerHTML = `
    <div class="topo">
      ${capa}
      <div>
        <h1>${esc(o.t)}</h1>
        <p class="au">${esc(o.a)}</p>
        <p class="meta">${esc(o.esc)} · ${situ}</p>
      </div>
    </div>
    <h2>Edições</h2>
    ${edicoes}
    ${leitura}
    <h2>Como ler a indicação</h2>
    <div class="panel">
      <p><span class="sym">◆</span> <strong>Do original</strong>: tradução feita diretamente da língua original, com tradutor identificado.</p>
      <p><span class="sym">◇</span> <strong>De outra língua</strong>: tradução feita de uma língua intermediária. A língua de origem aparece na indicação da edição.</p>
      <p><span class="sym">✎</span> <strong>Com notas</strong>: introdução, notas, comentário ou cronologia no próprio livro.</p>
    </div>`;
}
renderObra();
</script>
</body>
</html>
