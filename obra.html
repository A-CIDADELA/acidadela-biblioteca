<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A CIDADELA · Obra</title>
<meta name="description" content="Edições conferidas desta obra, com a indicação de tradução e de notas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
  :root{
    --paper:#1F1F20; --ink:#E6E7EA; --muted:#A3A8B0; --rule:#3A3B40;
    --silver:#C9CDD4; --panel:#2A2B2F; --accent:#D6DAE0;
    --serif:"Instrument Serif", "Iowan Old Style", Georgia, serif;
    --sans:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--paper); color:var(--ink);
    font:400 16px/1.6 var(--sans);
    padding-inline:max(16px, env(safe-area-inset-left,0px)) max(16px, env(safe-area-inset-right,0px));
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  .marca{display:block;width:100%;max-width:1000px;height:auto;margin:0 auto 8px}
  .marca img{display:block;width:100%;height:auto;-webkit-mask-image:radial-gradient(ellipse 72% 80% at 50% 50%,#000 62%,transparent 100%);mask-image:radial-gradient(ellipse 72% 80% at 50% 50%,#000 62%,transparent 100%)}
  :focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:2px}
  main{max-width:1000px;margin:0 auto;padding-block:28px 72px}

  .voltar{font-size:15px;margin:0}
  .voltar a{color:var(--muted);text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:4px}
  .voltar a:hover{color:var(--ink)}

  .topo{display:grid;gap:clamp(24px,5vw,64px);grid-template-columns:minmax(0,300px) minmax(0,1fr);align-items:start;margin-top:clamp(28px,5vw,56px)}
  .capa{aspect-ratio:2/3;background:var(--panel);border-radius:2px;overflow:hidden;max-width:100%}
  .capa img{display:block;width:100%;height:100%;object-fit:cover}
  .capa.prov{
    display:flex;flex-direction:column;justify-content:space-between;padding:22px;color:var(--ink);background:var(--panel);border-top:2px solid var(--silver);
  }
  .capa.prov .e{font-size:13px;opacity:.8}
  .capa.prov .t{font-family:var(--serif);font-size:34px;line-height:1.02;text-wrap:balance}
  .capa.prov .a{font-size:14px;opacity:.88;margin-top:8px}

  h1{font-family:var(--serif);font-weight:400;font-size:clamp(40px,6vw,60px);line-height:1;letter-spacing:-.01em;margin:0 0 14px;text-wrap:balance}
  .au{font-size:18px;margin:0 0 6px}
  .meta{font-size:15px;color:var(--muted);margin:0}

  h2{font-family:var(--serif);font-weight:400;font-size:28px;line-height:1.1;margin:0 0 4px}
  .secao{margin-top:clamp(40px,6vw,64px)}

  /* Edições: linhas com régua, sem caixas */
  .edicoes{border-top:1px solid var(--rule);margin:0;padding:0;list-style:none}
  .edicoes li{display:grid;gap:6px 24px;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;align-items:baseline;padding-block:18px;border-bottom:1px solid var(--rule)}
  .edicoes .formato{font-size:15px;font-weight:600}
  .edicoes .ed{margin:0;font-size:16px;line-height:1.5}
  .edicoes .sym{font-family:var(--serif);font-size:19px;color:var(--accent);margin-right:6px}
  .compra{font-size:15px;font-weight:600;text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:4px;text-decoration-thickness:1.5px;white-space:nowrap}
  .compra:hover{color:var(--accent)}
  .vazio{font-size:16px;color:var(--muted);margin:0;padding-block:18px;border-bottom:1px solid var(--rule)}
  .sem-edicao{margin:0;padding-block:18px;border-bottom:1px solid var(--rule);font-size:16px}

  .como{display:grid;gap:12px;margin:0;padding:0;list-style:none;font-size:15px;color:var(--muted)}
  .como li{display:grid;grid-template-columns:28px 1fr;gap:8px}
  .como .sym{font-family:var(--serif);font-size:19px;color:var(--accent)}
  .como strong{color:var(--ink);font-weight:600}

  .leitura{font-size:16px;margin:0}

  footer{border-top:1px solid var(--rule);margin-top:72px;padding-top:20px;color:var(--muted);font-size:14px;display:grid;gap:6px}
  footer p{margin:0}

  @media (max-width:720px){
    .topo{grid-template-columns:1fr}
    .capa{max-width:240px}
    .edicoes li{grid-template-columns:1fr;gap:4px}
    .compra{justify-self:start;margin-top:4px}
  }
</style>
</head>
<body>
<main>
<div class="marca" style="max-width:560px;margin:0 0 16px"><a href="index.html"><img src="assets/cabecalho.webp" width="1600" height="640" alt="A CIDADELA, voltar à biblioteca"></a></div>
<p class="voltar"><a href="index.html">Voltar à biblioteca</a></p>
<div id="conteudo"></div>
<footer>
  <p>A CIDADELA · Filosofia e estratégia para a vida</p>
  <p>Contato para direitos autorais: <a href="mailto:arquivo.cidadela@gmail.com">arquivo.cidadela@gmail.com</a></p>
</footer>
</main>

<script src="dados.js"></script>
<script>
function renderObra(){
  const id = new URLSearchParams(location.search).get("id");
  const o = OBRAS.find(x=>x.slug===id);
  const root = document.getElementById("conteudo");

  if(!o){
    root.innerHTML = `<div class="topo"><div><h1>Obra não encontrada</h1><p class="meta">Não há obra neste endereço. Volte à biblioteca e escolha outra.</p></div></div>`;
    return;
  }
  document.title = `${o.t} · A CIDADELA`;

  const era = ERAS.find(x=>x.id===o.e);
  const situ = o.s==="PD" ? "Domínio público" : `Protegida · domínio a partir de ${o.d}`;
  const capa = o.img
    ? `<div class="capa"><img src="${esc(o.img)}" alt="Capa de ${esc(o.t)}"></div>`
    : `<div class="capa prov" style="--c:${era.cor}"><span class="e">${esc(era.nome)}</span><div><div class="t">${esc(o.t)}</div><div class="a">${esc(o.a)}</div></div></div>`;

  const formatos = FORMATOS.filter(f=>o.links && o.links[f.k]);
  let edicoes;
  if(!o.ed){
    edicoes = `<p class="vazio">Edição em conferência. Nenhum link de compra aparece até a edição ser conferida.</p>`;
  } else if(!formatos.length){
    edicoes = `<p class="sem-edicao">${o.sym?`<span class="sym">${esc(o.sym)}</span>`:""}${esc(o.ed)}</p>`;
  } else {
    edicoes = `<ul class="edicoes">${formatos.map(f=>`
      <li>
        <span class="formato">${esc(f.rotulo)}</span>
        <p class="ed">${o.sym?`<span class="sym">${esc(o.sym)}</span>`:""}${esc(o.ed)}</p>
        <a class="compra" href="${esc(o.links[f.k])}" target="_blank" rel="noopener sponsored">Ver na Amazon</a>
      </li>`).join("")}</ul>`;
  }

  const leitura = o.leitura
    ? `<div class="secao"><h2>Leitura gratuita</h2><p class="leitura">${esc(o.leitura)}.</p></div>`
    : "";

  root.innerHTML = `
    <div class="topo">
      ${capa}
      <div>
        <h1>${esc(o.t)}</h1>
        <p class="au">${esc(o.a)}</p>
        <p class="meta">${esc(o.esc)} · ${esc(situ)}</p>
      </div>
    </div>
    <section class="secao">
      <h2>Edições</h2>
      ${edicoes}
    </section>
    ${leitura}
    <section class="secao">
      <h2>Como ler a indicação</h2>
      <ul class="como">
        <li><span class="sym">◆</span><span><strong>Do original.</strong> Traduzida diretamente da língua original, com tradutor identificado.</span></li>
        <li><span class="sym">◇</span><span><strong>De outra língua.</strong> Traduzida de uma língua intermediária. A língua aparece na indicação da edição.</span></li>
        <li><span class="sym">✎</span><span><strong>Com notas.</strong> Introdução, notas, comentário ou cronologia no próprio livro.</span></li>
      </ul>
    </section>`;
}
renderObra();
</script>
</body>
</html>
